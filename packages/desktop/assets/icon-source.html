<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
  body { display: grid; place-items: center; }

  /* macOS Big Sur icon grid: the artwork body is 824/1024 of the canvas with a
     ~22.4% corner radius, leaving transparent padding so it sits at the same
     visual size as every other app in the dock. Everything is a fraction of
     the canvas, so one page renders every size. */
  .body {
    width: 80.46%;      /* 824 / 1024 */
    height: 80.46%;
    border-radius: 18%; /* 184 / 1024 */
    background: linear-gradient(170deg, #1a1a1d 0%, #0b0b0c 62%);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  /* A hairline top edge, the same trick the app chrome uses: it stops a
     near-black icon reading as a hole on a dark dock. */
  .body::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0.35% 0 rgb(255 255 255 / 0.14),
                inset 0 0 0 0.25% rgb(255 255 255 / 0.06);
  }
  .mark {
    width: 52%;
    height: auto;
    /* The source art is a near-black trace; the brand mark is the light one. */
    filter: invert(1);
  }

  /* At 16 and 32px there are not enough pixels to hold the dots apart from the
     chevron, and the gradient and hairline become noise. Give the mark more of
     the tile and flatten everything else. */
  .small .body { background: #0b0b0c; }
  .small .body::after { box-shadow: inset 0 0 0 0.4% rgb(255 255 255 / 0.10); }
  .small .mark { width: 64%; }
</style>
<div class="body"><img class="mark" src="../../web/public/mark.svg"></div>
<script>
  const size = Number(new URLSearchParams(location.search).get("size") || 1024);
  if (size <= 32) document.documentElement.classList.add("small");
</script>
